[package]
name = "sineclave-pq-bench"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Reproducible micro-benchmarks of the standard post-quantum and classical primitives Sineclave builds on (FIPS 203/204, hybrid TLS 1.3)."
publish = false

[dependencies]
fips203 = "0.4.3"
fips204 = "0.4.6"
sha3 = "0.10"
aws-lc-rs = "1.19"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"

[features]
# Build against the FIPS 140-3 validated AWS-LC module (needs CMake, Go and Clang).
fips = ["aws-lc-rs/fips", "rustls/fips"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
